<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>봉필네 데릴사위</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700;800&family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 화면 전체가 게임기 — 복셀 봄 마을이 가장자리까지 깔리고, 위에는 떠 있는 상태줄, 아래에는 대화창, 결과와 시작은 마을 위에 뜨는 카드. 단일 테마(마을은 장면 시간에 따라 낮·아침·밤) */
:root {
  color-scheme: dark;
  --bg: #0E1411;
  --panel: #131B16;
  --panel-2: #1C261F;
  --glass: rgba(19, 27, 22, .9);
  --line: #2F3D34;
  --ink: #EEF1EA;
  --muted: #A3AFA6;
  --thatch: #D6AE55;
  --azalea: #EE719F;
  --field: #8CC063;
  --earth: #B8946A;
  --ok: #82C77F;
  --bad: #EA8569;
  --f-display: "Hahmlet", "Gowun Batang", "Noto Serif KR", serif;
  --f-story: "Gowun Batang", "Noto Serif KR", "AppleMyungjo", serif;
  --f-ui: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); font-size: 16px; line-height: 1.55; overflow: hidden; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--azalea); outline-offset: 2px; }

.app { position: relative; height: 100%; overflow: hidden; background: #BFDCE8; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }
#gl.dragging { cursor: grabbing; }

/* 머리 위 이름표 */
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lb { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; will-change: transform; }
.lb .nm { font-size: 12px; font-weight: 700; color: #EEF1EA; background: rgba(19, 27, 22, .74); padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.lb.me .nm { background: var(--thatch); color: #161D18; }
.lb.near .nm { box-shadow: 0 0 0 2px var(--thatch); }
.lb.obj .nm { background: rgba(214, 174, 85, .92); color: #161D18; }
.lb .bang { width: 26px; height: 26px; border-radius: 50%; background: var(--thatch); color: #161D18; font: 800 17px/26px var(--f-display); text-align: center; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); animation: bob 1s ease-in-out infinite; }
.lb .talk { background: #F3EFE4; color: #172019; border-radius: 10px; padding: 0 9px; font-weight: 800; letter-spacing: 2px; line-height: 20px; }
.place { position: absolute; left: 0; top: 0; font: 700 12px/1.3 var(--f-ui); color: #3A3326; background: rgba(245, 240, 225, .86); padding: 2px 8px; border-radius: 4px; border-bottom: 2px solid #8A6A40; white-space: nowrap; will-change: transform; }
.night .place { background: rgba(40, 48, 70, .8); color: #DDE3F5; border-bottom-color: #55628A; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

/* 상태줄 */
.hud { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.pill { background: var(--glass); border: 1px solid rgba(255, 255, 255, .08); border-radius: 14px; padding: 7px 12px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.scene-pill { font-family: var(--f-display); font-weight: 700; font-size: 14.5px; white-space: nowrap; line-height: 1.3; }
.scene-pill small { display: block; font-family: var(--f-ui); font-weight: 400; font-size: 11.5px; color: var(--muted); }
.gauges { display: flex; gap: 10px; flex: 1 1 250px; max-width: 420px; min-width: 0; }
.g { flex: 1 1 0; min-width: 0; }
.g .k { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.g .k b { color: var(--ink); font-variant-numeric: tabular-nums; }
.g .bar { height: 6px; border-radius: 3px; background: #2A362E; overflow: hidden; margin-top: 3px; }
.g .bar i { display: block; height: 100%; border-radius: 3px; transition: width .5s ease; }
.g-bae i { background: var(--field); } .g-sim i { background: var(--earth); } .g-jeom i { background: var(--azalea); }
.marks { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.marks b { color: var(--thatch); font-variant-numeric: tabular-nums; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.dots span { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots span.on { background: var(--azalea); border-color: var(--azalea); }
.tools { margin-left: auto; display: flex; gap: 6px; flex: 0 0 auto; }
.chip-btn { appearance: none; text-align: left; cursor: pointer; min-width: 0; max-width: 64%; min-height: 44px; padding: 5px 12px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .08); background: var(--glass); color: var(--ink); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.chip-btn b { display: block; font-family: var(--f-display); font-size: 14px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip-btn small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.icon-btn#rot-btn { font-size: 20px; padding: 0; width: 44px; }
.joy { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); background: rgba(19, 27, 22, .22); pointer-events: none; z-index: 3; }
.joy i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; border-radius: 50%; background: rgba(214, 174, 85, .92); box-shadow: 0 2px 0 rgba(0, 0, 0, .25); transform: translate(-50%, -50%); }
.freebar { display: flex; align-items: center; gap: 12px; }
.freebar .objective { flex: 1 1 auto; min-width: 0; margin: 0; font-size: 15.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.freebar .btn { flex: 0 0 auto; min-height: 50px; padding: 6px 16px; font-size: 15px; line-height: 1.25; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.freebar .btn small { font-size: 12px; font-weight: 400; opacity: .85; }
.menu-title { font-size: 24px; margin-top: 2px; }
.gauges-big { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.gauges-big .g .k { font-size: 13px; }
.gauges-big .g .bar { height: 8px; }
.menu-marks { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font-size: 14px; color: var(--muted); }
.menu-marks b { color: var(--thatch); }
.piece-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.piece-list li { background: var(--panel-2); border-radius: 10px; padding: 7px 10px; font-size: 13px; color: var(--muted); text-align: center; }
.piece-list li.got { color: #161D18; background: var(--thatch); font-weight: 700; }
.menu-h { font-size: 17px; margin-top: 18px; }
.guide summary { cursor: pointer; font-weight: 700; min-height: 36px; padding-top: 6px; }
a.btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
.reward { margin-top: 14px; border-radius: 14px; padding: 14px 16px; background: var(--panel-2); border: 1px dashed var(--line); display: grid; gap: 6px; }
.reward p { font-size: 15px; line-height: 1.65; }
.reward.on { border: 2px solid var(--azalea); background: linear-gradient(135deg, #3C2430, #1C261F); }
.reward.on h3 { font-size: 22px; color: var(--azalea); }
.reward.on .btn { justify-self: start; background: var(--azalea); color: #1A0F14; min-width: 200px; }
.icon-btn { appearance: none; border: 1px solid rgba(255, 255, 255, .08); min-width: 46px; height: 44px; border-radius: 12px; background: var(--glass); color: var(--ink); font-weight: 700; font-size: 13px; padding: 0 11px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.icon-btn:active { transform: scale(.96); }

.toast { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); background: rgba(14, 20, 17, .92); color: var(--ink); border: 1px solid var(--thatch); padding: 8px 16px; border-radius: 16px; font-size: 14px; max-width: min(360px, calc(100% - 32px)); text-align: center; pointer-events: none; z-index: 3; }
.toast.show { animation: pop 3s ease forwards; }
@keyframes pop { 0% { opacity: 0; transform: translate(-50%, -6px); } 8%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }

/* 대화창 */
.dock { position: absolute; left: 0; right: 0; bottom: 0; top: 28%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.dock-card { pointer-events: auto; width: 100%; max-width: 880px; max-height: 100%; overflow: auto; margin: 0 auto; background: rgba(19, 27, 22, .95); border: 1px solid var(--line); border-top: 3px solid var(--thatch); border-radius: 18px; padding: 14px 16px 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.dock-card.compact { max-width: 620px; }
.eyebrow { font-size: 12.5px; letter-spacing: .06em; color: var(--thatch); font-weight: 700; }
.objective { font-family: var(--f-story); font-size: 17px; line-height: 1.6; margin-top: 2px; }
.dlg { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; cursor: pointer; align-items: start; min-height: 120px; }
.dlg.narr { grid-template-columns: minmax(0, 1fr); }
.dlg.static { cursor: default; }
.portrait svg { width: 92px; height: 92px; display: block; border-radius: 14px; }
.nameplate { display: inline-block; font-weight: 700; font-size: 14px; padding: 2px 10px; border-radius: 4px; color: #131B16; margin-bottom: 4px; }
.text { font-family: var(--f-story); font-size: 18px; line-height: 1.8; max-width: 36em; min-height: 3.4em; }
.dlg.narr .text { color: #D7DDD3; }
.dlg.narr .text::before { content: "— "; color: var(--muted); }
.more { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 14px; font-weight: 700; color: #161D18; background: var(--thatch); padding: 6px 14px; border-radius: 999px; }
.more::after { content: "▶"; font-size: 11px; }
.ask { font-weight: 700; font-size: 16.5px; }
.ask small { display: block; font-weight: 400; color: var(--muted); font-size: 13.5px; }
.choices { display: grid; gap: 8px; margin-top: 10px; }
.choice { appearance: none; text-align: left; cursor: pointer; width: 100%; min-height: 52px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; align-items: center; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); font-size: 16px; line-height: 1.45; transition: border-color .12s, background .12s, transform .08s; }
.choice:hover { border-color: var(--thatch); }
.choice:active { background: #2A3A2E; transform: scale(.99); }
.choice .mk { font-family: var(--f-display); font-weight: 700; color: var(--thatch); font-size: 18px; }
.choice .tx small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.btn { appearance: none; border: 0; cursor: pointer; border-radius: 12px; min-height: 50px; padding: 12px 20px; font-size: 16px; font-weight: 700; font-family: var(--f-ui); background: var(--thatch); color: #161D18; }
.btn:active { transform: scale(.98); background: #E8C46E; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.row .btn { flex: 1 1 180px; }
.hint { font-size: 13px; color: var(--muted); margin-top: 8px; }

.verdict { padding: 12px 14px; border-radius: 12px; display: grid; gap: 4px; }
.verdict.ok { background: #1D3420; } .verdict.bad { background: #3A2219; }
.verdict .v { font-weight: 700; }
.verdict.ok .v { color: var(--ok); } .verdict.bad .v { color: var(--bad); }
.verdict p { font-family: var(--f-story); font-size: 16.5px; line-height: 1.75; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.chip.up { color: var(--ok); border-color: currentColor; } .chip.down { color: var(--bad); border-color: currentColor; }

.mash .meter { height: 20px; border-radius: 10px; background: #26322A; overflow: hidden; margin-top: 10px; }
.mash .meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--earth), var(--thatch)); }
.mash .big { width: 100%; margin-top: 12px; font-size: 22px; min-height: 84px; border-radius: 18px; }

/* 떠 있는 카드 */
.sheet { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: rgba(8, 12, 10, .5); z-index: 4; }
.sheet.title { align-items: flex-end; background: linear-gradient(rgba(8, 12, 10, 0) 25%, rgba(8, 12, 10, .62)); }
.sheet-card { width: 100%; max-width: 720px; max-height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 22px 22px 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, .4); }
.title-card h2 { font-size: clamp(38px, 8vw, 60px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin-top: 6px; }
.title-card h2 em { font-style: normal; color: var(--azalea); }
.lede { font-family: var(--f-story); font-size: 17px; line-height: 1.75; max-width: 36em; margin-top: 10px; color: #D7DDD3; }
.howto { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.howto div { background: var(--panel-2); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
.howto b { display: block; color: var(--thatch); font-size: 13px; }
.title-card input { flex: 1 1 220px; min-width: 0; padding: 13px 14px; font: inherit; font-size: 16px; min-height: 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); color: var(--ink); -webkit-user-select: text; user-select: text; }
.title-card label { width: 100%; font-size: 13px; color: var(--muted); }

.notes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
.note { background: var(--panel-2); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; }
.note .t { font-size: 12px; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.note h4 { font-size: 16.5px; }
.note p { font-size: 15px; line-height: 1.7; }
.note p.st { font-family: var(--f-story); }
.inter { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 18px; align-items: center; }
.inter svg { width: 96px; height: auto; display: block; }
.inter h3 { font-size: 21px; }
.inter p { font-family: var(--f-story); font-size: 16.5px; line-height: 1.7; margin-top: 6px; color: #D7DDD3; }
.end-title { font-size: clamp(30px, 6vw, 46px); font-weight: 800; margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
.stat { border-top: 2px solid var(--thatch); padding-top: 8px; }
.stat .k { font-size: 12.5px; color: var(--muted); }
.stat .n { font-family: var(--f-display); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 13.5px; }
.log { margin-top: 16px; overflow-x: auto; }
.log table { border-collapse: collapse; width: 100%; min-width: 500px; font-size: 14px; }
.log th, .log td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.log th { font-size: 12px; color: var(--muted); }
.y { color: var(--ok); } .n2 { color: var(--bad); }
.discuss, .pieces { margin-top: 16px; }
.discuss h3, .pieces h3 { font-size: 18px; }
.discuss ol, .pieces ul, .guide ul { margin: 8px 0 0; padding-left: 1.3em; display: grid; gap: 6px; font-family: var(--f-story); font-size: 16px; line-height: 1.65; }
.pieces li b, .guide li b { font-family: var(--f-ui); color: var(--thatch); }
.guide { margin-top: 18px; }
.guide h3 { font-size: 18px; }

@media (max-width: 700px) {
  .gauges { order: 3; flex-basis: 100%; max-width: none; }
  .scene-pill { font-size: 13.5px; }
  .dlg { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; min-height: 108px; }
  .portrait svg { width: 64px; height: 64px; border-radius: 12px; }
  .text { font-size: 16.5px; }
  .objective { font-size: 16px; }
  .notes, .stats { grid-template-columns: minmax(0, 1fr); }
  .howto { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .inter { grid-template-columns: 72px minmax(0, 1fr); }
  .inter svg { width: 72px; }
  .sheet-card { padding: 18px 16px 20px; border-radius: 18px; }
  .dock { top: 22%; }
  .freebar .objective { font-size: 14.5px; }
  .toast { top: 62px; }
  .gauges-big { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .piece-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet.title .lede { font-size: 15.5px; line-height: 1.65; }
  .sheet.title .title-card h2 { font-size: 36px; }
  .sheet.title .howto div { padding: 8px 10px; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .toast.show, .lb .bang { animation: none; }
  .g .bar i { transition: none; }
}
</style>

<div class="app" id="app">
  <canvas id="gl" aria-label="복셀로 만든 봄 마을. 땅을 누르면 '나'가 걸어가고, 사람을 누르면 말을 건다. 화면을 끌면 돌려 볼 수 있다."></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div class="hud" id="hud"></div>
  <div class="toast" id="toast" role="status" hidden></div>
  <div class="dock" id="dock" aria-live="polite" hidden></div>
  <div class="sheet" id="sheet" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  "use strict";
  const L = (who, expr, text) => ({ who, expr, text });
  const N = text => ({ who: "narr", text });
  /* ================= 인물 ================= */
  const CH = {
    na:      { name: "나",        shirt: "#ECE5D4", pants: "#8B7355", hair: "#2B2420", s: 1.15, tag: "#D6AE55", bg: "#2E3A2C" },
    jangin:  { name: "장인님",    robe: "#BDB49E", hair: "#2E2E2E", beard: "#77736B", s: 1.05, tag: "#B8946A", bg: "#3A3026" },
    jeomsun: { name: "점순",      top: "#F2C94C", skirt: "#D9534F", hair: "#2B2420", ribbon: "#B8282F", s: 0.82, tag: "#EE719F", bg: "#3C2430" },
    jangmo:  { name: "장모님",    top: "#F2EFE6", skirt: "#3E5A8A", hair: "#2B2420", s: 0.76, tag: "#9DB4DC", bg: "#25304A" },
    gujang:  { name: "구장",      robe: "#F0EDE4", hair: "#2E2E2E", beard: "#DAD6CD", s: 1.05, tag: "#CFC8B6", bg: "#33332E" },

  function bindUI() {
    const on = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
    const f = $("start-form");
    if (f) f.addEventListener("submit", ev => {
      ev.preventDefault(); audio();

    });

      const sv = loadSave(); if (!sv) return; audio();
      const n = $("player-name") ? $("player-name").value.trim() : "";

      const mode = S.mode; S.mode = "free";
      setupScene(Math.min(S.sc, NS - 1));
      P.x = S.px; P.z = S.pz; if (!walkable(P.x, P.z)) { const c = ctr(nearestFree(tileAt(P.x, P.z))); P.x = c.x; P.z = c.z; }
      S.mode = mode; R.near = null; renderHUD(); renderUI();

    on("go-btn", () => { const main = ENT[SCENES[S.sc].npcs.find(n => n.main).id]; R.pending = main.id; walkTo(P, main.x, main.z, false); });
    dockEl.querySelectorAll("[data-act]").forEach(b => b.addEventListener("click", () => pickAction(+b.dataset.act)));
    dockEl.querySelectorAll("[data-pred]").forEach(b => b.addEventListener("click", () => pickPred(+b.dataset.pred)));
    sheetEl.querySelectorAll("[data-bonus]").forEach(b => b.addEventListener("click", () => { if (S.bonus !== null) return; S.bonus = +b.dataset.bonus; const ok = S.bonus === BONUS.answer; if (ok) S.nunchi++; sfx(ok ? "ok" : "bad"); renderHUD(); renderUI(); }));

    on("sc-btn", endScene);
    on("next-btn", () => startScene(S.sc + 1));
    on("end-btn", () => {

      const p = T(400, 340); P.x = p.x; P.z = p.z; P.lie = false; P.path = [];

    });

  }

  /* ================= 입력 ================= */
  const KEYMAP = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down", A: "left", D: "right", W: "up", S: "down" };
  window.addEventListener("keydown", ev => {
    const tgt = ev.target;
    if (tgt && tgt.closest && tgt.closest("input, textarea")) return;
    const k = KEYMAP[ev.key];
    if (k && S.mode === "free" && !R.help) { keys[k] = true; ev.preventDefault(); return; }
    if (ev.key === " " || ev.key === "Enter") {
      if (tgt && tgt.closest && tgt.closest("button, a, [role=button]")) return;
      if (S.mode === "dialog") { ev.preventDefault(); advance(); }
      else if (S.mode === "mash") { ev.preventDefault(); mashTap(); }
      else if (S.mode === "free" && R.near) { ev.preventDefault(); const e = ents().find(x => x.id === R.near); if (e) talk(e); }
      else if (S.mode === "verdict") { ev.preventDefault(); afterVerdict(); }
      return;
    }
    if (ev.key === "q" || ev.key === "Q") { yawGoal += Math.PI / 4; return; }
    if (ev.key === "e" || ev.key === "E") { yawGoal -= Math.PI / 4; return; }
    if (/^[1-3]$/.test(ev.key)) { const i = +ev.key - 1; if (S.mode === "choice") pickAction(i); else if (S.mode === "predict") pickPred(i); }
  });
  window.addEventListener("keyup", ev => { const k = KEYMAP[ev.key]; if (k) keys[k] = false; });
  window.addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

  const ptrs = new Map(); let pinch = null, lastTap = null, wasMulti = false;
  const joyEl = document.createElement("div"); joyEl.className = "joy"; joyEl.hidden = true; joyEl.innerHTML = "<i></i>"; appEl.appendChild(joyEl);
  const JOY = 52;
  function startStick(x, y) { const ar = appEl.getBoundingClientRect(); R.stick = { sx: x, sy: y, vx: 0, vy: 0 }; joyEl.style.left = (x - ar.left) + "px"; joyEl.style.top = (y - ar.top) + "px"; joyEl.hidden = false; R.pending = null; P.path = []; }
  function moveStick(x, y) {
    if (!R.stick) return;
    let dx = x - R.stick.sx, dy = y - R.stick.sy; const l = Math.hypot(dx, dy);
    if (l > JOY) { dx = dx / l * JOY; dy = dy / l * JOY; }
    R.stick.vx = dx / JOY; R.stick.vy = dy / JOY;
    joyEl.firstElementChild.style.transform = `translate(calc(-50% + ${dx.toFixed(1)}px), calc(-50% + ${dy.toFixed(1)}px))`;
  }
  function stopStick() { R.stick = null; joyEl.hidden = true; joyEl.firstElementChild.style.transform = ""; }
  function pickAt(cx, cy) {
    const r = cv.getBoundingClientRect(), nx = ((cx - r.left) / r.width) * 2 - 1, ny = -((cy - r.top) / r.height) * 2 + 1;
    raycaster.setFromCamera({ x: nx, y: ny }, cam);
    const roots = activeNPCs().map(e => e.c.root);
    const hits = raycaster.intersectObjects(roots, true);
    if (hits.length) { const id = hits[0].object.userData.ent; const e = ents().find(x => x.id === id); if (e) return { ent: e }; }
    let best = null, bd = 28;
    for (const e of ents()) {
      const y = e.obj ? 0.8 : (ENT[e.id] ? ENT[e.id].c.h * 0.6 : 0.8);
      const s = screenOf(e.x, groundY(e.x, e.z) + y, e.z), d = Math.hypot(s.x - (cx - r.left), s.y - (cy - r.top));
      if (d < bd) { bd = d; best = e; }
    }
    if (best) return { ent: best };
    const o = raycaster.ray.origin, dir = raycaster.ray.direction;
    if (Math.abs(dir.y) < 1e-6) return null;
    const t = -o.y / dir.y;
    return { x: o.x + dir.x * t, z: o.z + dir.z * t };
  }
  function onTap(cx, cy) {
    audio();
    if (S.mode === "dialog") { advance(); return; }
    if (S.mode === "mash") return;
    if (S.mode !== "free") return;
    const now = performance.now();
    const dbl = lastTap && now - lastTap.t < 340 && Math.hypot(cx - lastTap.x, cy - lastTap.y) < 40;
    lastTap = dbl ? null : { t: now, x: cx, y: cy };
    const hit = pickAt(cx, cy); if (!hit) return;
    if (hit.ent) {
      const e = hit.ent;
      if (Math.hypot(e.x - P.x, e.z - P.z) < 1.6) { talk(e); return; }
      R.pending = e.id; walkTo(P, e.x, e.z, dbl);
    } else {
      R.pending = null;
      if (dbl && P.path.length) { P.dash = true; sfx("dash"); }
      else walkTo(P, hit.x, hit.z, dbl);
    }
  }
  const angleOf = (a, b) => Math.atan2(b.y - a.y, b.x - a.x);
  cv.addEventListener("pointerdown", ev => {
    audio();
    if (S.mode === "mash") { ev.preventDefault(); mashTap(); return; }
    try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
    ptrs.set(ev.pointerId, { x: ev.clientX, y: ev.clientY, sx: ev.clientX, sy: ev.clientY, mode: null, rotate: ev.button === 2 || ev.ctrlKey || ev.shiftKey });
    if (ptrs.size === 2) { const [p1, p2] = [...ptrs.values()]; pinch = { d: Math.hypot(p1.x - p2.x, p1.y - p2.y), z: zoomMul, ang: angleOf(p1, p2), yaw: yawGoal }; wasMulti = true; stopStick(); }
  });
  cv.addEventListener("pointermove", ev => {
    const p = ptrs.get(ev.pointerId); if (!p) return;
    const dx = ev.clientX - p.x; p.x = ev.clientX; p.y = ev.clientY;
    if (ptrs.size === 1 && !wasMulti) {
      if (!p.mode && Math.hypot(ev.clientX - p.sx, ev.clientY - p.sy) > 12) {
        p.mode = (p.rotate || S.mode !== "free") ? "rotate" : "stick";
        if (p.mode === "stick") startStick(p.sx, p.sy); else cv.classList.add("dragging");
      }
      if (p.mode === "rotate" && S.mode !== "title") { yawGoal -= dx * 0.008; yaw = yawGoal; }
      if (p.mode === "stick") moveStick(ev.clientX, ev.clientY);
    } else if (ptrs.size === 2 && pinch) {
      const [p1, p2] = [...ptrs.values()], d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      zoomMul = Math.max(0.55, Math.min(2.1, pinch.z * pinch.d / Math.max(20, d)));
      if (S.mode !== "title") { yawGoal = pinch.yaw - (angleOf(p1, p2) - pinch.ang); yaw = yawGoal; }
    }
  });
  const endPtr = ev => {
    const p = ptrs.get(ev.pointerId); ptrs.delete(ev.pointerId);
    if (ptrs.size < 2) pinch = null;
    cv.classList.remove("dragging");
    if (p && p.mode === "stick") stopStick();
    if (ev.type === "pointerup" && p && !p.mode && !wasMulti && ptrs.size === 0) onTap(ev.clientX, ev.clientY);
    if (ptrs.size === 0) wasMulti = false;
  };
  cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr);
  cv.addEventListener("wheel", ev => { ev.preventDefault(); zoomMul = Math.max(0.55, Math.min(2.1, zoomMul * (1 + ev.deltaY * 0.0012))); }, { passive: false });
  cv.addEventListener("contextmenu", ev => ev.preventDefault());

  /* ================= 시작 ================= */
  function resize() {
    VW = appEl.clientWidth || 1; VH = appEl.clientHeight || 1;
    narrow = VW < 700 || VH > VW * 1.1;
    if (renderer) renderer.setSize(VW, VH, false);
  }
  let last = 0;
  function frame(ts) {
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0); last = ts;
    update(dt); updateCamera(dt); applyLight(dt);
    renderer.render(scene, cam); updateLabels();
    requestAnimationFrame(frame);
  }
  function boot() {
    if (!GL) {
      sheetEl.hidden = false; sheetEl.className = "sheet";
      sheetEl.innerHTML = `<div class="sheet-card"><div class="eyebrow">봉필네 데릴사위</div><h2 style="margin-top:6px">3D 화면을 열 수 없어요</h2><p class="lede">이 기기나 브라우저에서는 3D 그래픽이 꺼져 있어요. 크롬이나 사파리 최신 버전으로 다시 열어 보세요.</p></div>`;
      return;
    }
    BOXG = new THREE.BoxGeometry(1, 1, 1);
    scene = new THREE.Scene();
    cam = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 200);
    raycaster = new THREE.Raycaster();
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    hemi = new THREE.HemisphereLight("#FFFFFF", "#6E8452", 0.58); scene.add(hemi);
    sun = new THREE.DirectionalLight("#FFF4DE", 0.85); sun.castShadow = true;
    const small = Math.min(window.innerWidth, window.innerHeight) < 600;
    sun.shadow.mapSize.set(small ? 1024 : 2048, small ? 1024 : 2048);
    Object.assign(sun.shadow.camera, { left: -26, right: 26, top: 26, bottom: -26, near: 1, far: 90 });
    sun.shadow.camera.updateProjectionMatrix(); sun.shadow.bias = -0.0008; sun.shadow.normalBias = 0.02;
    scene.add(sun); scene.add(sun.target);
    lantern = new THREE.PointLight("#FFC070", 0, 9, 1.6); lantern.position.set(14.5, 1.3, 7.2); scene.add(lantern);
    world = buildWorld(); scene.add(world);
    for (const o of OBJ3) {
      const g = new THREE.Mesh(BOXG, new THREE.MeshLambertMaterial({ color: "#FFE07A", emissive: "#D6A43A", emissiveIntensity: 0.7 }));
      g.scale.setScalar(0.24); g.rotation.x = 0.6; g.position.set(o.x, 1.45, o.z); scene.add(g); sparks[o.id] = g;
    }
    P = ent("na"); P.active = true; P.c.root.visible = true; P.x = 2.5; P.z = 0;
    setupScene(0);
    resize();
    if (window.ResizeObserver) new ResizeObserver(resize).observe(appEl); else window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", () => setTimeout(resize, 250));
    renderHUD(); renderUI();
    requestAnimationFrame(frame);
  }
  boot();

})();
</script>
